name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dyploma-backend
    # Same major version as docker-compose.yml, so migrations are tested on the real engine.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aegis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d aegis_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_DATABASE: aegis_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dyploma-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Apply every migration to an empty database, then fail if the entities
      # describe a schema the migrations don't produce.
      - run: npm run migration:run
      - run: npm run migration:check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next build # includes the TypeScript check
