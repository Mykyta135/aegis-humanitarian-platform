services:
  db:
    image: postgres:14-alpine
    container_name: aegis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aegis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./dyploma-backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: password
      DB_DATABASE: aegis_db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32) in your shell or a root .env file}
      FRONTEND_URL: http://localhost:3001
      # Local demo only: enables POST /seed (demo accounts with known passwords).
      ENABLE_SEED: "true"
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:?set OPENROUTESERVICE_API_KEY in your shell or a root .env file}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: aegis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  postgres_data:
